# E1: Qwen3-4B + LoRA (bf16 全精度, 32GB 无需量化)
model_name_or_path: /root/autodl-tmp/qwen_sft/models/Qwen3-4B
template: qwen
stage: sft
finetuning_type: lora
dataset: sft_10k
dataset_dir: /root/autodl-tmp/qwen_sft/data
cutoff_len: 1024
learning_rate: 2.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
bf16: true
lora_rank: 16
lora_alpha: 32
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
output_dir: /root/autodl-tmp/qwen_sft/out/e1_qwen3-4b_lora
logging_steps: 20
save_steps: 500
plot_loss: true
do_train: true
report_to: none
